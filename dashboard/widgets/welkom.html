<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welkom bij Reforge</title>
<style>
  :root { color-scheme: light; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    box-sizing: border-box;
  }
  body {
    padding: 8px;
    background: #f6f8f6;
    color: #1f4d3a;
    font-family: Manrope, Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .kaart {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 6px;
    padding: 0 20px;
    background: #ffffff;
    border: 1px solid rgba(31, 77, 58, .15);
    border-left: 4px solid #1f4d3a;
    border-radius: 14px;
    overflow: hidden;
  }
  h1 {
    margin: 0;
    max-width: 100%;
    font-size: clamp(16px, 5.5vw, 20px);
    font-weight: 600;
    line-height: 1.25;
    color: #1f4d3a;
    overflow-wrap: anywhere;
  }
  p {
    margin: 0;
    max-width: 100%;
    font-size: 13px;
    line-height: 1.4;
    color: #5b6b63;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
  <div class="kaart">
    <h1>Welkom bij Reforge 👋</h1>
    <p>Gebouwd op 29 oktober 2026 om 17:11</p>
  </div>
</body>
</html>
